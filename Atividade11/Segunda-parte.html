<script>
    class Conta {
        constructor(nome, banco, numeroConta, saldo) {
            this._nome = nome;
            this._banco = banco;
            this._numeroConta = numeroConta;
            this._saldo = saldo;
        }

        // GET e SET
        get nome() {
            return this._nome;
        }

        set nome(valor) {
            this._nome = valor;
        }

        get banco() {
            return this._banco;
        }

        set banco(valor) {
            this._banco = valor;
        }

        get numeroConta() {
            return this._numeroConta;
        }

        set numeroConta(valor) {
            this._numeroConta = valor;
        }

        get saldo() {
            return this._saldo;
        }

        set saldo(valor) {
            this._saldo = valor;
        }
    }

    class Corrente extends Conta {
        constructor(nome, banco, numeroConta, saldo, saldoEspecial) {
            super(nome, banco, numeroConta, saldo);
            this._saldoEspecial = saldoEspecial;
        }

        get saldoEspecial() {
            return this._saldoEspecial;
        }

        set saldoEspecial(valor) {
            this._saldoEspecial = valor;
        }
    }

    class Poupanca extends Conta {
        constructor(nome, banco, numeroConta, saldo, juros, dataVencimento) {
            super(nome, banco, numeroConta, saldo);
            this._juros = juros;
            this._dataVencimento = dataVencimento;
        }

        get juros() {
            return this._juros;
        }

        set juros(valor) {
            this._juros = valor;
        }

        get dataVencimento() {
            return this._dataVencimento;
        }

        set dataVencimento(valor) {
            this._dataVencimento = valor;
        }
    }

    let contaCorrente = new Corrente(
        "Antonio",
        "Banco do Brasil",
        "12345",
        2000,
        500
    );

    let contaPoupanca = new Poupanca(
        "Maria",
        "Caixa",
        "67890",
        3000,
        5,
        "10/12/2026"
    );

    alert(
        "CONTA CORRENTE\n" +
        "Nome: " + contaCorrente.nome + "\n" +
        "Banco: " + contaCorrente.banco + "\n" +
        "Número da Conta: " + contaCorrente.numeroConta + "\n" +
        "Saldo: " + contaCorrente.saldo + "\n" +
        "Saldo Especial: " + contaCorrente.saldoEspecial
    );

    alert(
        "CONTA POUPANÇA\n" +
        "Nome: " + contaPoupanca.nome + "\n" +
        "Banco: " + contaPoupanca.banco + "\n" +
        "Número da Conta: " + contaPoupanca.numeroConta + "\n" +
        "Saldo: " + contaPoupanca.saldo + "\n" +
        "Juros: " + contaPoupanca.juros + "%\n" +
        "Data de Vencimento: " + contaPoupanca.dataVencimento
    );
</script>
