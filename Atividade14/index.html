<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 14</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<form name="nomeform" onsubmit="return validar()">

    <h2>Formulário Principal</h2>

    <label>Nome:</label><br>
    <input type="text" name="nome"><br><br>

    <label>E-mail:</label><br>
    <input type="email" name="email"><br><br>

    <label>Comentário:</label><br>
    <textarea name="comentario" rows="5"></textarea><br><br>

    <h3>Pesquisa</h3>
    <p>Primeira vez nesta página?</p>

    <input type="radio" name="pesquisa" value="sim"> Sim
    <input type="radio" name="pesquisa" value="nao"> Não
    <br><br>

    <input type="submit" value="Enviar">
    <input type="reset" value="Limpar">

</form>

<script src="script.js"></script>

</body>
</html>
