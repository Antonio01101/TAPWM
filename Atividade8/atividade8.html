<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atividade 8</title>

<style>
body{
    font-family: Arial, Helvetica, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 30px;
}

.container{
    max-width: 800px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

h1{
    text-align: center;
    color: #333;
}

.box{
    background: #f8f8f8;
    padding: 20px;
    margin-top: 20px;
    border-left: 5px solid #4CAF50;
    border-radius: 8px;
}

input{
    padding: 8px;
    margin: 5px;
    width: 80px;
}

button{
    padding: 10px 15px;
    background: #4CAF50;
    color: white;
    border: none;
    cursor: pointer;
    border-radius: 5px;
}

button:hover{
    background: #45a049;
}
</style>
</head>

<body>

<div class="container">
    <h1>Atividade 8</h1>

    <!-- EXERCÍCIO 1 -->
    <div class="box">
        <h2>Exercício 1</h2>

        <input type="number" id="n1" placeholder="Número 1">
        <input type="number" id="n2" placeholder="Número 2">
        <input type="number" id="n3" placeholder="Número 3">

        <br><br>
        <button onclick="calcular()">Calcular</button>

        <p id="resultado1"></p>
    </div>

    <!-- EXERCÍCIO 2 -->
    <div class="box">
        <h2>Exercício 2</h2>

        <input type="text" id="l1" maxlength="1" placeholder="Letra 1">
        <input type="text" id="l2" maxlength="1" placeholder="Letra 2">
        <input type="text" id="l3" maxlength="1" placeholder="Letra 3">
        <input type="text" id="l4" maxlength="1" placeholder="Letra 4">
        <input type="text" id="l5" maxlength="1" placeholder="Letra 5">

        <br><br>
        <button onclick="gerarPalavras()">Gerar</button>

        <p id="resultado2"></p>
    </div>
</div>

<script>
// EXERCÍCIO 1
function calcular(){
    let n1 = Number(document.getElementById("n1").value);
    let n2 = Number(document.getElementById("n2").value);
    let n3 = Number(document.getElementById("n3").value);

    let soma = n1 + n2 + n3;
    let quadrado1 = n1 * n1;
    let quadrado2 = n2 * n2;

    document.getElementById("resultado1").innerHTML =
        "A soma dos três números é " + soma +
        ", o quadrado do primeiro é " + quadrado1 +
        " e o quadrado do segundo é " + quadrado2;
}


// EXERCÍCIO 2
function gerarPalavras(){
    let letras = [
        document.getElementById("l1").value.toUpperCase(),
        document.getElementById("l2").value.toUpperCase(),
        document.getElementById("l3").value.toUpperCase(),
        document.getElementById("l4").value.toUpperCase(),
        document.getElementById("l5").value.toUpperCase()
    ];

    let palavras = [];

    while(palavras.length < 10){
        let palavra = "";

        for(let i = 0; i < 5; i++){
            let posicao = Math.floor(Math.random() * letras.length);
            palavra += letras[posicao];
        }

        if(palavras.indexOf(palavra) === -1){
            palavras.push(palavra);
        }
    }

    document.getElementById("resultado2").innerHTML = palavras.join("<br>");
}
</script>

</body>
</html>
